# Generates OpenSms executables for Linux

name: 'Windows Executables'

on:

  #push:
  #  branches:
  #    - main
  #  paths:
  #    - 'app/**'
  workflow_dispatch:

# Top-level permissions
permissions:
  contents: read

jobs:
  win_build:
    name: 'Build and Release'
    runs-on: windows-2022
    permissions:
      contents: write       # Needed to create/update the release and tags
      pull-requests: read

    steps:

      - name: GIT Checkout
        id: 'git-checkout'
        uses: "actions/checkout@v4"

      # 1. Install Mesa3D so the headless runner supports OpenGL 2.0+
      - name: Setup Mesa3D for OpenGL 2.0+
        uses: ssciwr/setup-mesa-dist-win@v3

      - name: Set version
        id: 'set_version'
        shell: python
        working-directory: ./app
        env:
          PYTHONPATH: .
        run: |
          import os
          from services.config import __version__ as app_version
          # Write to GITHUB_OUTPUT
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"app_version=v{app_version}\n")

      - name: Check app version
        run: |
          echo "App version is: ${{ steps.set_version.outputs.app_version }}"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Pip Install n Checks
        id: 'pip_install'
        run: |
          cd app
          python --version
          pip install -r req_desktop.txt
          python -c "
          import kivy
          print('Kivy:', kivy.__version__)
          "

      - name: Test CLI imports
        shell: pwsh
        run: |
          cd app
          python openSmsCli.py --help

      - name: PyInstaller CLI
        id: 'py_cli'
        run: |
          cd app
          pyinstaller --clean --noconfirm desktopCli.spec

      - name: PyInstaller GUI
        id: 'py_gui'
        shell: pwsh
        run: |
          cd app
          pyinstaller --clean --noconfirm desktopGui.spec

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.set_version.outputs.app_version }}
          name: ${{ steps.set_version.outputs.app_version }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            app/dist/openSmsCli.exe
            app/dist/OpenSmsApp.exe
