# Generates OpenSms executables for Linux

name: 'Linux Executables'

on:

  push:
    branches:
      - main
    paths:
      - 'app/**'
  workflow_dispatch:

# Top-level permissions
permissions:
  contents: read

jobs:
  linux_job:
    name: 'Build and Release'
    runs-on: 'ubuntu-24.04'
    permissions:
      contents: write       # Needed to create/update the release and tags
      pull-requests: read

    steps:

      - name: GIT Checkout
        id: 'git-checkout'
        uses: "actions/checkout@v4"

      - name: Install Dependencies
        id: 'install_prereq'
        run: |
          sudo apt-get update
          sudo apt install -y libcairo2-dev pkg-config libjpeg-dev zlib1g-dev \
            libgl1-mesa-dev libgles2-mesa-dev freeglut3-dev libsdl2-dev \
            libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Set version
        id: 'set_version'
        shell: python
        working-directory: ./app
        env:
          PYTHONPATH: .
        run: |
          import os
          from services.config import __version__ as app_version
          # Write to GITHUB_OUTPUT
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"app_version=v{app_version}\n")

      - name: Check app version
        run: |
          echo "App version is: ${{ steps.set_version.outputs.app_version }}"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Pip Install n Checks
        id: 'pip_install'
        run: |
          cd app/
          python --version
          ldd --version | head -1
          pip install -r req_desktop.txt
          python -c "
          import kivy
          print('Kivy:', kivy.__version__)
          "
          python -m pip freeze | sort

      - name: PyInstaller CLI
        id: 'py_cli'
        run: |
          cd app/
          pyinstaller desktopCli.spec
          pyinstaller desktopGui.spec

      - name: Extract changelog for release
        env:
          VERSION: ${{ steps.set_version.outputs.app_version }}
        run: |
          python -c "
          import os, re
          ver = os.environ['VERSION'].lstrip('v')
          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
              text = f.read()
          # Match from '### 1.2.0' until the next '### ' or '## ' heading
          pattern = rf'(?m)^###\s+v?{re.escape(ver)}\b.*?\n(.*?)(?=^###?\s|\Z)'
          match = re.search(pattern, text, re.DOTALL)
          notes = match.group(1).strip() if match else f'Release {ver}'
          with open('RELEASE_NOTES.md', 'w', encoding='utf-8') as f:
              f.write(notes)
          "

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.set_version.outputs.app_version }}
          name: ${{ steps.set_version.outputs.app_version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: true
          generate_release_notes: false
          files: |
            app/dist/openSmsCli
            app/dist/OpenSmsApp
