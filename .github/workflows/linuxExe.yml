# Generates OpenSms executables for Linux

name: 'Linux Executables'

on:

  push:
    branches:
      - 'develop' # will change to main
    paths:
      - 'app/**'

# Top-level permissions
permissions:
  contents: read
  id-token: write

jobs:
  linux_cli:
    name: 'Main Job'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: write       # 👈 Needed to create/update the release and tags
      pull-requests: read

    steps:

      - name: GIT Checkout
        id: 'git-checkout'
        uses: "actions/checkout@v4"

      - name: Install Dependencies
        id: 'install_prereq'
        run: |
          #sudo apt update
          sudo apt install -y libcairo2-dev pkg-config libjpeg-dev zlib1g-dev \
            libgl1-mesa-dev libgles2-mesa-dev freeglut3-dev libsdl2-dev \
            libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Set version
        id: 'set_version'
        shell: python
        working-directory: ./app
        env:
          PYTHONPATH: .
        run: |
          import os
          from services.config import __version__ as app_version
          # Write to GITHUB_OUTPUT
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"app_version=v{app_version}\n")

      - name: Check app version
        run: |
          echo "App version is: ${{ steps.set_version.outputs.app_version }}"

      - name: PyInstaller CLI
        id: 'py_cli'
        run: |
          cd app/
          python -m venv .env
          source .env/bin/activate
          pip install -r req_desktop.txt
          pyinstaller desktopCli.spec
          pyinstaller desktopGui.spec

      #- name: Upload artifact
      #  uses: actions/upload-pages-artifact@v3
      #  with:
      #    path: './flasher'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.set_version.outputs.app_version }}
          name: ${{ steps.set_version.outputs.app_version }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            app/dist/openSmsCli
            app/dist/OpenSmsApp
