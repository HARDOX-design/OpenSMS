# Runs the off-device test suite on Linux without Android.

name: 'Tests'

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'app/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux_tests:
    name: 'Unit tests (Linux)'
    runs-on: 'ubuntu-24.04'

    steps:

      - name: GIT Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        working-directory: ./app
        run: |
          pip install fastapi uvicorn psutil pyserial -r requirements-dev.txt

      - name: Run unit tests
        working-directory: ./app
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
